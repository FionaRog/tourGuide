name: TourGuide CI

on:
  push:
    branches:
      - master

  pull_request:
      branches:
        - master

  workflow_dispatch:

jobs:
  build:
    name: Compile, test and package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TourGuide

    steps:
      #1. Récupère le contenu du dépôt
      - name: Checkout repository
        uses: actions/checkout@v5

      #2. Installe Java et configure le cache Maven
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: TourGuide/pom.xml

      - name: Install gpsUtil dependency
        run: >
          mvn --batch-mode install:install-file
          -Dfile=libs/gpsUtil.jar
          -DgroupId=gpsUtil
          -DartifactId=gpsUtil
          -Dversion=1.0.0
          -Dpackaging=jar

      - name: Install tripPricer dependency
        run: >
          mvn --batch-mode install:install-file
          -Dfile=libs/tripPricer.jar
          -DgroupId=tripPricer
          -DartifactId=tripPricer
          -Dversion=1.0.0
          -Dpackaging=jar

      - name: Install rewardCentral dependency
        run: >
          mvn --batch-mode install:install-file
          -Dfile=libs/RewardCentral.jar
          -DgroupId=rewardCentral
          -DartifactId=rewardCentral
          -Dversion=1.0.0
          -Dpackaging=jar    

      #3. Vérifie que le projet compile
      - name: Compile application
        run: mvn --batch-mode clean compile

      #4. Exécute les tests, hors tests de performance
      - name: Run tests
        run: mvn --batch-mode test -Dtest='!TestPerformance'

      #5. Construit le fichier JAR sans rejouer les tests
      - name: Build artifact
        run: mvn --batch-mode package -DskipTests

      #6. Enregistre le JAR généré
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourguide-jar
          path: TourGuide/target/*.jar
          if-no-files-found: error